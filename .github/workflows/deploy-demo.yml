name: Deploy FolderFrame demo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-demo.yml"
      - "demo-photos/**"
      - "docs/images/folderframe-icon.png"
      - "docs/images/folderframe-logo.png"
      - "app.js"
      - "settings.js"
      - "resilience.js"
      - "styles.css"
      - "index.html"
      - "generate_thumbnails.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: folderframe-demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install demo image dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if find demo-photos -type f \( -iname '*.heic' -o -iname '*.heif' \) -print -quit | grep -q .; then
            python -m pip install --disable-pip-version-check pillow-heif
          fi

      - name: Generate thumbnails and persistent manifest
        run: |
          mkdir -p demo-thumbnails demo-manifest
          python generate_thumbnails.py demo-photos demo-thumbnails \
            --manifest demo-manifest/index.json

      - name: Assemble static demo
        shell: bash
        run: |
          mkdir -p _site/docs/images
          cp index.html app.js settings.js resilience.js styles.css heic2any.min.js _site/
          cp docs/images/folderframe-logo.png docs/images/folderframe-icon.png _site/docs/images/
          cp -R demo-photos demo-thumbnails demo-manifest _site/
          printf '%s\n' 'demo.folderframe.com' > _site/CNAME
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("folderframe.config.json")
          config = json.loads(source_path.read_text(encoding="utf-8"))
          source = next(
              (item for item in config.get("sources", []) if item.get("id") == "photos"),
              None,
          )
          if source is None:
              raise SystemExit("folderframe.config.json has no photos source")
          source.update({
              "path": "demo-photos/",
              "thumbnailPath": "demo-thumbnails/",
              "manifestPath": "demo-manifest/index.json",
              "discoveryMode": "manifest",
              "scanCache": False,
          })
          Path("_site/folderframe.config.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )

          demo_page = Path("_site/index.html")
          demo_html = demo_page.read_text(encoding="utf-8")
          if demo_html.count("</body>") != 1:
              raise SystemExit("Expected exactly one </body> in demo index")
          demo_return = """
              <style>
                  .demo-return-link {
                      position: fixed;
                      left: max(14px, env(safe-area-inset-left));
                      bottom: max(14px, env(safe-area-inset-bottom));
                      z-index: 1000;
                      display: inline-flex;
                      align-items: center;
                      min-height: 42px;
                      padding: 0 16px;
                      border: 1px solid rgba(255, 255, 255, 0.18);
                      border-radius: 10px;
                      background: rgba(18, 18, 18, 0.88);
                      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
                      color: #fff;
                      font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                      text-decoration: none;
                      backdrop-filter: blur(12px);
                      -webkit-backdrop-filter: blur(12px);
                  }
                  .demo-return-link:hover,
                  .demo-return-link:focus-visible {
                      border-color: rgba(255, 255, 255, 0.4);
                      background: rgba(38, 38, 38, 0.94);
                  }
                  .demo-return-link:focus-visible {
                      outline: 2px solid #6aa9ff;
                      outline-offset: 2px;
                  }
              </style>
              <a class="demo-return-link" href="https://www.folderframe.com/">Return to FolderFrame.com</a>
          """
          demo_page.write_text(
              demo_html.replace("</body>", demo_return + "\n</body>"),
              encoding="utf-8",
          )
          PY

      - name: Verify static demo
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/docs/images/folderframe-logo.png
          test -s _site/docs/images/folderframe-icon.png
          test -s _site/folderframe.config.json
          test -s _site/demo-manifest/index.json
          test -d _site/demo-thumbnails
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("_site/folderframe.config.json").read_text())
          source = next(item for item in config["sources"] if item["id"] == "photos")
          assert source["path"] == "demo-photos/"
          assert source["thumbnailPath"] == "demo-thumbnails/"
          assert source["manifestPath"] == "demo-manifest/index.json"
          assert source["discoveryMode"] == "manifest"
          assert source["scanCache"] is False
          manifest = json.loads(Path("_site/demo-manifest/index.json").read_text())
          assert manifest["version"] == 1
          assert not list(Path("_site/demo-photos").rglob("index.html"))
          demo_html = Path("_site/index.html").read_text()
          assert demo_html.count('class="demo-return-link"') == 1
          assert 'href="https://www.folderframe.com/"' in demo_html
          assert "Return to FolderFrame.com" in demo_html
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
