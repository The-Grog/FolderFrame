name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check settings.js
          node --check resilience.js
      - name: Run application tests
        run: |
          node --test tests/configuration.test.cjs
          node --test tests/resilience.test.cjs
      - name: Validate thumbnail generator
        run: python -m py_compile generate_thumbnails.py