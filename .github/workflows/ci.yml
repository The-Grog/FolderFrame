name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install Pillow
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check settings.js
          node --check resilience.js
      - name: Run application tests
        run: |
          node --test tests/configuration.test.cjs
          node --test tests/resilience.test.cjs
      - name: Validate thumbnail generator
        run: |
          python -m py_compile generate_thumbnails.py
          python tests/thumbnail_failure_cache.test.py
          python tests/thumbnail_pruning_signature.test.py
          python tests/exif_metadata.test.py
          python tests/video_duration.test.py
          python tests/video_posters.test.py
